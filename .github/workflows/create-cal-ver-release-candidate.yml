name: "Create CalVer Release Candidate"

on:
  workflow_dispatch:

jobs:
  create-cal-ver-release-candidate:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
    steps:
      - name: 'Get next CalVer release version'
        id: 'next_release_version'
        uses: 'tv2/ag-github-actions/.github/actions/get-next-cal-ver-release-version@v0'

      - name: 'Call create release action'
        uses: 'tv2/ag-github-actions/.github/actions/create-release-candidate@v1'
        with:
          release_version: ${{ steps.next_release_version.outputs.release_version }}
          docker_repos: 'tv2media/alba-server tv2media/alba-server-migrations'
          docker_username: ${{ secrets.DOCKERHUB_USERNAME }}
          docker_password: ${{ secrets.DOCKERHUB_PASSWORD }}