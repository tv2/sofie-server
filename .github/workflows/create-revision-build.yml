name: 'Create Revision Build'
on:
  workflow_dispatch:
  push:
    branches:
        - main
        - 'release/**'

jobs:
  create-revision-build:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
    steps:
      - name: 'Get next CalVer release version'
        id: 'next_release_version'
        uses: 'tv2/ag-github-actions/.github/actions/get-next-cal-ver-release-version@v2'
        continue-on-error: true

      - name: 'Create revision build'
        uses: 'tv2/ag-github-actions/.github/actions/create-revision-build@v2'
        with:
          docker_repo: tv2media/alba-server
          docker_username: ${{ secrets.DOCKERHUB_USERNAME }}
          docker_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          release_version: ${{ steps.next_release_version.outputs.release_version }}

      - name: 'Build migrations'
        uses: 'tv2/ag-github-actions/.github/actions/create-revision-build@v2'
        with:
           docker_repo: tv2media/alba-server-migrations
           docker_username: ${{ secrets.DOCKERHUB_USERNAME }}
           docker_password: ${{ secrets.DOCKERHUB_PASSWORD }}
           docker_context: './migrations'
           release_version: ${{ steps.next_release_version.outputs.release_version }}
