name: 'Check'
run-name: 'Test, build, lint and validate'

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  status:
    uses: tv2/ag-github-actions/.github/workflows/status-check.yml@v0.2.0
    with:
      node-version: '22.6'
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}